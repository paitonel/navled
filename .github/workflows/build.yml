name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the overlay files are up to date
        run: |
          K=overlay/android/app/src/main/kotlin/com/nelson/navled
          ls -l $K overlay/lib overlay/android/app/src/main
          fail() { echo "::error::$1"; exit 1; }
          test -f $K/GpsSpeedService.kt || fail "GpsSpeedService.kt is missing"
          grep -q "gpsStop" $K/MainActivity.kt || fail "MainActivity.kt is outdated"
          grep -q "scheduleRetry" $K/BleBridge.kt || fail "BleBridge.kt is outdated"
          grep -q "NavInfo" $K/NavParser.kt || fail "NavParser.kt is outdated"
          grep -q "variant" $K/NavListenerService.kt || fail "NavListenerService.kt is outdated"
          grep -q "GpsSpeedService" overlay/android/app/src/main/AndroidManifest.xml || fail "AndroidManifest.xml is outdated"
          grep -q "nativeVer" overlay/lib/main.dart || fail "main.dart is outdated"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: flutter create --org com.nelson --project-name navled app

      - name: Add our files
        run: |
          rm -rf app/test
          cp -r overlay/* app/

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: navled-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: NavTurnLED build ${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
